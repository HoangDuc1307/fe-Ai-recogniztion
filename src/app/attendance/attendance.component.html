<div class="attendance-container">
  <!-- Camera -->
  <div class="camera-box">
    <video autoplay playsinline muted></video>

    <p
      class="message"
      [ngClass]="{
        success: message.includes('thành công'),
        error: message.includes('Không') || message.includes('Lỗi')
      }"
    >
      {{ message }}
    </p>
  </div>

  <!-- Thông tin sinh viên -->
  <div class="info-box">
    <h3>Thông tin điểm danh</h3>
    <table>
      <tr>
        <th>Mã sinh viên</th>
        <td>{{ studentId || '—' }}</td>
      </tr>
      <tr>
        <th>Họ tên</th>
        <td>{{ fullName || '—' }}</td>
      </tr>
      <tr>
        <th>Thời gian</th>
        <td>{{ time || '—' }}</td>
      </tr>
    </table>
    <div *ngIf="framedImage" class="result-box">
      <h4>Ảnh nhận diện (đã xử lý):</h4>
      <img [src]="framedImage" alt="Ảnh nhận diện" width="300" height="240" />
    </div>
  </div>
</div>

<div class="wrapper dashboard-wrapper">
	<div class="d-flex flex-wrap flex-xl-nowrap">
		<app-sidebar></app-sidebar>
	<div class="page-content">
		<app-headeradmin></app-headeradmin>
<div class="dashboard-page-content" data-animated-id="1">
					
	<div class="row mb-9 align-items-center justify-content-between">
		
		<div class="col-sm-6 mb-8 mb-sm-0">
			<h2 class="fs-4 mb-0">Quản lý sinh viên </h2>
		</div>
	</div>
	
	
		<div class="row">
			<div class="col-lg-9">
				<div class="card mb-4 rounded-4 p-7">
					<div class="card-header bg-transparent px-0 pt-0 pb-7">
						<div class="row align-items-center justify-content-between">
		<div class="col-md-4 col-12 mr-auto mb-md-0 mb-6">
			<input type="text" placeholder="Search..." class="form-control bg-input border-0">
		</div>
		<div class="col-md-8">
			<div class=" row justify-content-end flex-nowrap d-flex">
				<div class="col-lg-3 col-md-6 col-6">
					
				</div>
				<div class="col-lg-3 col-md-6 col-6">
					<a href="order-detail.html" class="btn btn-primary py-4 fs-13px btn-xs me-4">Search</a>
				</div>
			</div>
		</div>
	</div>
					</div>
					<div class="card-body px-0 pt-7 pb-0">
		<div class="table-responsive">
			<table class="table table-hover align-middle table-nowrap mb-0 table-borderless"><thead class="table-light">
						<tr>
							<th class="align-middle" scope="col">Mã sinh viên
							</th>
							<th class="align-middle" scope="col"> Họ và tên
							</th>
							<th class="align-middle" scope="col">Lớp
							</th>
							<th class="align-middle" scope="col">Trạng thái
							</th>
							<th class="align-middle" scope="col">Thời gian
							</th>
							<th class="align-middle text-center" scope="col">Hình ảnh 
							</th>
						<th class="align-middle text-center" scope="col">Action
						</th>
							
						</tr>
					</thead><tbody>
  <tr *ngFor ="let usercheckin of usercheckins">
    <td><a href="#">{{usercheckin.student_id || 100}}</a></td>
    <td class="text-body-emphasis">{{usercheckin.user_face?.full_name }}</td>
    <td>{{usercheckin.user_face?.className}}</td>
    <td>
      <span class="badge rounded-lg rounded-pill alert py-3 px-4 mb-0 border-0 text-capitalize fs-12">
        
      </span>
    </td>
    <td>{{usercheckin.check_in_time | date:'short'}}</td>
    <td>
        <div class="text-center">
            <img class="img-avatar loaded" [src]="usercheckin.framed_image.replace('/media/media/', '/media/') || '../assets/images/dashboard/avatar-1.png'"  width="56" height="56" loading="lazy">
        </div>
    </td>
	<td class="text-center">
		<div class="d-flex flex-nowrap justify-content-center">
		  <button (click)="deleteUserCheck($event,usercheckin.id)" class="btn btn-primary py-4 fs-13px btn-xs me-4">Delete</button>
		  
		</div>
	  </td>
  </tr>
</tbody>
			</table>
		</div>
	</div>
				</div>
			</div>
			<div class="col-lg-3">
				<div class="card mb-5 rounded-4">
					<div class="card-body">
						<h5 class="mb-6 fs-6">Lọc danh sách</h5>
						<form class="form-border-1">
							<div class="mb-7">
								<label for="order_id" class="mb-4 fs-13px letter-spacing-01 font-weight-600 text-uppercase">Lớp</label>
								<input type="text" placeholder="Type here" class="form-control" id="order_id">
							</div>
							<div class="mb-7">
								<label for="order_customer" class="mb-4 fs-13px letter-spacing-01 font-weight-600 text-uppercase">Trạng thái</label>
								<input type="text" placeholder="Type here" class="form-control" id="order_customer">
							</div>
                            <div class="mb-7">
								<label for="order_customer" class="mb-4 fs-13px letter-spacing-01 font-weight-600 text-uppercase">Thời gian</label>
								<input type="text" placeholder="Type here" class="form-control" id="order_customer">
							</div>
							
							<div class="mb-7">
								
							</div>
							<div class="mb-7">
								
							</div>
							<div class="mb-7">
								
							</div>
							<div class="mb-7">
								<a href="order-detail.html" class="btn btn-primary py-4 fs-13px btn-xs me-4">Lọc</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	
	
					</div>
				</div>
			</div>
		</div>

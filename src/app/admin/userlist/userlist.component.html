<div class="wrapper dashboard-wrapper">
    <div class="d-flex flex-wrap flex-xl-nowrap">
        <app-sidebar></app-sidebar>
        <div class ="page-content">
            <app-headeradmin></app-headeradmin>
            <div class="dashboard-page-content" data-animated-id="1">
					
                <div class="row mb-9 align-items-center justify-content-between">
                    
                    <div class="col-sm-6 mb-8 mb-sm-0">
                        <h2 class="fs-4 mb-0">Thông tin sinh viên</h2>
                    </div>
                    <div class="col-sm-6 d-flex flex-wrap justify-content-sm-end">
                        
                   
                    
                    </div>
                </div>
                
                
                <div class="card mb-4 rounded-4 p-7">
                  <div class="card-body py-7 px-0">
                    <div class="row">
                      <div class="col-12" *ngIf="error" style="color:#c00; padding: 0 12px 12px;">{{ error }}</div>
                      <div class="col-sm-6 col-lg-3 mb-9" *ngFor="let u of users">
                        <div class="card card-user rounded-4">
                          <div class="card-header text-center">
                            <img class="img-avatar loaded" [src]="buildImageUrl(u.face_image)" width="112" height="112" loading="lazy">
                          </div>
                          <div class="card-body text-center p-7">
                            <h5 class="card-title mt-12 fs-6 mb-6">{{ u.full_name }}</h5>
                            <div class="card-text text-muted">
                              <p class="m-0">Mã sinh viên: {{ u.student_id }}</p>
                              <p class="mb-0">Lớp: {{ u.class_name_name || u.class_name || '—' }}</p>
                            </div>
                            <button class="btn btn-sm btn-primary fs-14px mt-6" (click)="openDetail(u)">Chi tiết</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
                <nav aria-label="Page navigation example" class="mt-6 mb-4">
                    <ul class="pagination justify-content-start">
                        <li class="page-item active mx-3"><a class="page-link" href="#">01</a></li>
                        <li class="page-item mx-3"><a class="page-link" href="#">02</a></li>
                        <li class="page-item mx-3"><a class="page-link" href="#">03</a></li>
                        <li class="page-item mx-3"><a class="page-link dot" href="#">...</a></li>
                        <li class="page-item mx-3"><a class="page-link" href="#">16</a></li>
                        <li class="page-item mx-3">
                            <a class="page-link" href="#"><i class="far fa-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
                
                <div class="row" *ngIf="selectedUser">
                  <div class="col-lg-4 ms-auto">
                    <div class="card mb-5 rounded-4">
                      <div class="card-body">
                        <h5 class="mb-4 fs-6">Sửa thông tin</h5>
                        <div class="mb-3">
                          <label>Họ và tên</label>
                          <input class="form-control" [(ngModel)]="editFullName">
                        </div>
                        <div class="mb-3">
                          <label>Mã sinh viên</label>
                          <input class="form-control" [(ngModel)]="editStudentId">
                        </div>
                        <div class="mb-3">
                          <label>Lớp</label>
                          <select class="form-control" [(ngModel)]="editClassId">
                            <option [ngValue]="null">—</option>
                            <option *ngFor="let c of classes" [ngValue]="c.id">{{ c.name }}</option>
                          </select>
                        </div>
                        <div class="d-flex gap-2">
                          <button class="btn btn-primary" (click)="saveEdit()">Lưu</button>
                          <button class="btn btn-secondary" (click)="cancelEdit()">Hủy</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                
                                </div>
        </div>
    </div>
</div>
